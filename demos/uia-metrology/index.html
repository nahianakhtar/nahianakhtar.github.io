<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Per-Monitor V2 UIA DPI Coordinate Metrology Bench | Nahian Akhtar</title>
  <style>
    :root { --bg:#F2EFE9; --surface:#FFFFFF; --cobalt:#1D3557; --teal:#2A9D8F; --ink:#141C24; --muted:#4E5D6C; --rule:rgba(29,53,87,0.16); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,-apple-system,sans-serif; line-height:1.5; overflow-x:clip; }
    .wrap { max-width:1160px; margin:0 auto; padding:1.5rem 1rem 3rem; }
    .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.75rem; border-bottom:2px solid var(--cobalt); padding-bottom:0.85rem; margin-bottom:1.25rem; }
    .kicker { display:block; font-family:ui-monospace,monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--teal); font-weight:700; }
    .top h1 { margin:0.15rem 0 0; font-size:clamp(1.25rem,2.3vw,1.72rem); color:var(--cobalt); }
    .nav { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .nav a { font-family:ui-monospace,monospace; font-size:0.78rem; padding:0.32rem 0.68rem; border:1px solid var(--rule); border-radius:4px; background:var(--surface); color:var(--cobalt); text-decoration:none; }
    .grid { display:grid; grid-template-columns:minmax(0,360px) minmax(0,1fr); gap:1.1rem; }
    @media (max-width:900px) { .grid { grid-template-columns:minmax(0,1fr); } }
    .panel { min-width:0; max-width:100%; background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:1rem; }
    label { display:block; font-size:0.82rem; font-weight:600; margin:0.65rem 0 0.25rem; }
    input[type="range"] { width:100%; accent-color:var(--cobalt); }
    .dpi-pills { display:flex; flex-wrap:wrap; gap:0.38rem; margin-top:0.35rem; }
    .pill { border:1px solid var(--rule); background:var(--bg); color:var(--cobalt); border-radius:4px; padding:0.34rem 0.6rem; font-family:ui-monospace,monospace; font-size:0.76rem; font-weight:600; cursor:pointer; }
    .pill.active { background:var(--cobalt); color:#fff; border-color:var(--cobalt); }
    .svg-stage { background:var(--bg); border:1px solid var(--rule); border-radius:6px; padding:0.6rem; cursor:crosshair; }
    .svg-stage svg { width:100%; height:auto; display:block; }
    .readout { display:grid; grid-template-columns:repeat(3, 1fr); gap:0.55rem; margin-top:0.8rem; }
    @media (max-width:600px) { .readout { grid-template-columns:1fr; } }
    .rcell { border:1px solid var(--rule); border-radius:4px; padding:0.55rem; background:var(--bg); font-family:ui-monospace,monospace; }
    .rcell span { display:block; font-size:0.68rem; color:var(--muted); }
    .rcell strong { font-size:0.9rem; color:var(--cobalt); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div>
        <span class="kicker">Project E · Industrial Calibration UIA Bench</span>
        <h1>Windows Per-Monitor V2 UIA Coordinate &amp; Hit-Test Metrology</h1>
      </div>
      <div class="nav">
        <a href="../">All 5 Workbenches</a>
        <a href="../../">Portfolio Studio</a>
      </div>
    </div>

    <div class="grid">
      <section class="panel">
        <span class="kicker">1. Display Scaling &amp; Logical Pointer</span>
        <label>Target DPI Scaling Tier (1.00x to 2.00x)</label>
        <div class="dpi-pills" id="dpi-pills">
          <button type="button" class="pill" data-dpi="96">96 DPI (1.00x)</button>
          <button type="button" class="pill active" data-dpi="120">120 DPI (1.25x)</button>
          <button type="button" class="pill" data-dpi="144">144 DPI (1.50x)</button>
          <button type="button" class="pill" data-dpi="168">168 DPI (1.75x)</button>
          <button type="button" class="pill" data-dpi="192">192 DPI (2.00x)</button>
        </div>

        <label for="x-slider">CSS X Coordinate: <strong id="x-val">260 px</strong></label>
        <input id="x-slider" type="range" min="10" max="620" value="260" />

        <label for="y-slider">CSS Y Coordinate: <strong id="y-val">170 px</strong></label>
        <input id="y-slider" type="range" min="10" max="290" value="170" />

        <label for="ox-slider">Win32 Client Physical Origin X: <strong id="ox-val">68 px</strong></label>
        <input id="ox-slider" type="range" min="0" max="400" value="68" />

        <button id="center-hit-btn" type="button" class="pill active" style="margin-top:0.85rem;width:100%;">Snap Pointer Into UIA Target Box</button>
      </section>

      <section class="panel" aria-live="polite">
        <span class="kicker">2. Dual-Monitor Viewport &amp; Bounding-Box Hit-Test Parity</span>
        <div id="monitor-svg-host" class="svg-stage" aria-label="Interactive DPI calibration monitor diagram"></div>
        <div id="readout-grid" class="readout"></div>
      </section>
    </div>
  </main>

  <script type="module">
    import {
      physicalToLogicalPoint,
      solveMonitorTransition,
      verifyBoundingBoxHitTest
    } from "../algorithms.mjs";

    let dpi = 120;
    const xEl = document.getElementById("x-slider");
    const yEl = document.getElementById("y-slider");
    const oxEl = document.getElementById("ox-slider");
    const xOut = document.getElementById("x-val");
    const yOut = document.getElementById("y-val");
    const oxOut = document.getElementById("ox-val");
    const svgHost = document.getElementById("monitor-svg-host");
    const readEl = document.getElementById("readout-grid");
    const boxCss = { x: 200, y: 120, w: 180, h: 100 };

    function render() {
      const t0 = performance.now();
      const xCss = Number(xEl.value);
      const yCss = Number(yEl.value);
      const ox = Number(oxEl.value);
      const oy = 40;
      xOut.textContent = `${xCss} px`;
      yOut.textContent = `${yCss} px`;
      oxOut.textContent = `${ox} px`;

      const hit = verifyBoundingBoxHitTest({
        xCss,
        yCss,
        boxCss,
        clientOriginPhysX: ox,
        clientOriginPhysY: oy,
        dpi
      });
      const back = physicalToLogicalPoint({
        xPhys: hit.pt.xPhys,
        yPhys: hit.pt.yPhys,
        clientOriginPhysX: ox,
        clientOriginPhysY: oy,
        dpi
      });
      const mon = solveMonitorTransition({
        xCss,
        yCss,
        monitors: [
          { id: "Primary 2560x1440", originPhysX: 0, originPhysY: 0, widthPhys: 2560, heightPhys: 1440, dpi },
          { id: "Secondary 1920x1080", originPhysX: 2560, originPhysY: 0, widthPhys: 1920, heightPhys: 1080, dpi: 96 }
        ]
      });
      const dt = performance.now() - t0;

      svgHost.innerHTML = `<svg id="calib-svg" viewBox="0 0 640 310" role="img" aria-label="CSS target box and crosshair">
        <rect x="8" y="8" width="624" height="294" rx="6" fill="#FFFFFF" stroke="#1D3557" stroke-width="1.5" />
        <text x="20" y="28" font-family="ui-monospace,monospace" font-size="11" fill="#4E5D6C">MONITOR 1 · ${dpi} DPI (${(dpi / 96).toFixed(2)}x) · ORIGIN (${ox}, ${oy})</text>
        <rect x="${boxCss.x}" y="${boxCss.y}" width="${boxCss.w}" height="${boxCss.h}" rx="5" fill="${hit.physHit ? "rgba(42,157,143,0.18)" : "rgba(29,53,87,0.08)"}" stroke="${hit.physHit ? "#2A9D8F" : "#1D3557"}" stroke-width="2" />
        <text x="${boxCss.x + boxCss.w / 2}" y="${boxCss.y + 54}" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#1D3557">UIA Button Target (${boxCss.w}x${boxCss.h} CSS)</text>
        <line x1="${xCss}" y1="10" x2="${xCss}" y2="300" stroke="#2A9D8F" stroke-dasharray="4 4" />
        <line x1="10" y1="${yCss}" x2="630" y2="${yCss}" stroke="#2A9D8F" stroke-dasharray="4 4" />
        <circle cx="${xCss}" cy="${yCss}" r="6" fill="${hit.physHit ? "#2A9D8F" : "#1D3557"}" />
      </svg>`;

      readEl.innerHTML = `
        <div class="rcell"><span>Physical Win32 Point</span><strong>(${hit.pt.xPhys}, ${hit.pt.yPhys})</strong></div>
        <div class="rcell"><span>Inverse CSS Round-Trip</span><strong>(${back.xCss.toFixed(2)}, ${back.yCss.toFixed(2)})</strong></div>
        <div class="rcell"><span>AABB Hit Parity (${dt.toFixed(2)} ms)</span><strong>${hit.physHit ? "HIT" : "MISS"} / PARITY=${hit.parity}</strong></div>
        <div class="rcell"><span>Target Top-Left Phys</span><strong>(${hit.topLeft.xPhys}, ${hit.topLeft.yPhys})</strong></div>
        <div class="rcell"><span>Target Bot-Right Phys</span><strong>(${hit.botRight.xPhys}, ${hit.botRight.yPhys})</strong></div>
        <div class="rcell"><span>Resolved Display</span><strong>${mon.monitorId}</strong></div>
      `;
    }

    svgHost.addEventListener("click", (ev) => {
      const svg = document.getElementById("calib-svg");
      if (!svg) return;
      const r = svg.getBoundingClientRect();
      xEl.value = String(Math.round(((ev.clientX - r.left) / r.width) * 640));
      yEl.value = String(Math.round(((ev.clientY - r.top) / r.height) * 310));
      render();
    });

    document.querySelectorAll("#dpi-pills .pill").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll("#dpi-pills .pill").forEach((p) => p.classList.remove("active"));
        b.classList.add("active");
        dpi = Number(b.getAttribute("data-dpi") || 120);
        render();
      });
    });

    document.getElementById("center-hit-btn").addEventListener("click", () => {
      xEl.value = String(boxCss.x + boxCss.w / 2);
      yEl.value = String(boxCss.y + boxCss.h / 2);
      render();
    });

    xEl.addEventListener("input", render);
    yEl.addEventListener("input", render);
    oxEl.addEventListener("input", render);
    render();
  </script>
</body>
</html>
